<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta property="og:title" content="Geheimkabinett – Jeder Fall ein Rätsel">
<meta property="og:description" content="Rätsel, Fälle und versteckte Hinweise. Schau genau hin.">

<style>
@font-face{font-family:"Cormorant Garamond";font-weight:600;font-display:swap;src:url(fonts/cormorant-600.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url(fonts/inter-400.woff2) format("woff2")}
:root{--bg:#0E0D0B;--gold:#C9A45C;--gold-hi:#F0D598;--cream:#ECE6D9;--grey:#B5AC9B}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--cream);font-family:Inter,system-ui,sans-serif;overflow:hidden}
a{color:var(--gold)}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.nogl #gl{display:none}
.nogl body,.nogl{background:#000 url(hero.webp) 52% 50%/cover no-repeat}

.stage{position:fixed;inset:0;display:grid;place-items:center;padding:24px 24px 64px;pointer-events:none}
.card{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(12px,2.2vh,22px);pointer-events:auto}
.card::before{content:"";position:absolute;inset:-18% -30%;z-index:-1;background:radial-gradient(ellipse at center,rgba(8,7,5,.78),rgba(8,7,5,.45) 45%,transparent 72%);opacity:0;transition:opacity 1.6s ease .6s}
.on .card::before{opacity:1}

.eye{width:min(26vmin,190px);height:auto;overflow:visible;filter:drop-shadow(0 0 22px rgba(240,213,152,.45))}
.eye .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.on .eye .draw{animation:draw 1.5s cubic-bezier(.6,.05,.3,1) forwards}
.on .eye .lid{animation-delay:.5s}
@keyframes draw{to{stroke-dashoffset:0}}
.iris{transform-box:view-box;transform-origin:100px 100px;transform:scale(0);transition:transform .9s cubic-bezier(.2,1.5,.4,1) 1.3s}
.on .iris{transform:scale(1)}
.lidgroup{transform-box:view-box;transform-origin:100px 100px}
.lidgroup.blink{animation:blink .3s ease-in-out}
@keyframes blink{0%,100%{transform:scaleY(1)}45%{transform:scaleY(.06)}}
.look{transition:transform .3s cubic-bezier(.2,.8,.3,1)}

h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(28px,7.4vw,92px);letter-spacing:.2em;margin:0 -.2em 0 0;line-height:1;white-space:nowrap;text-shadow:0 2px 30px rgba(0,0,0,.9)}
h1 span{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(18px) scale(1.25)}
.on h1 span{animation:letter 1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(1.1s + var(--i)*.06s)}
@keyframes letter{55%{opacity:1;filter:blur(0);color:var(--gold-hi);text-shadow:0 0 28px rgba(240,213,152,.95)}100%{opacity:1;filter:blur(0);transform:none;color:var(--cream)}}
.rule{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transition:width 1.2s cubic-bezier(.6,0,.2,1) 2.1s}
.on .rule{width:min(60vw,320px)}
.tag{font-size:clamp(11px,1.6vw,15px);letter-spacing:.45em;text-transform:uppercase;color:var(--grey);margin:0 -.45em 0 0;min-height:1.4em;text-shadow:0 1px 12px #000}
.caret{display:inline-block;width:.55em;border-bottom:1px solid var(--gold);margin-left:2px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}

.fade{opacity:0;transform:translateY(16px);filter:blur(6px);transition:opacity 1s ease,transform 1s ease,filter 1s ease}
.on .fade{opacity:1;transform:none;filter:none}
.on .f1{transition-delay:3.2s}.on .f2{transition-delay:3.5s}.on .f3{transition-delay:3.8s}.on .f4{transition-delay:4.6s}
.lead{max-width:30em;margin:4px 0 0;line-height:1.6;font-size:clamp(14px,1.8vw,17px);text-shadow:0 1px 14px #000}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;list-style:none;padding:0;margin:4px 0 0}
.links a{position:relative;display:inline-flex;align-items:center;min-height:46px;padding:11px 24px;border:1px solid rgba(201,164,92,.65);border-radius:999px;text-decoration:none;letter-spacing:.12em;font-size:14px;color:var(--cream);background:rgba(14,13,11,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);overflow:hidden;transition:color .3s,border-color .3s,box-shadow .3s,transform .2s ease-out;will-change:transform}
.links a::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,var(--gold),var(--gold-hi));transform:translateY(101%);transition:transform .35s cubic-bezier(.6,0,.2,1);z-index:-1}
.links a:hover,.links a:focus-visible{color:#0E0D0B;border-color:var(--gold-hi);box-shadow:0 0 28px rgba(240,213,152,.45)}
.links a:hover::before,.links a:focus-visible::before{transform:none}
.mail{font-size:15px;letter-spacing:.06em;text-shadow:0 1px 12px #000}
.hint{position:fixed;left:0;right:0;bottom:54px;text-align:center;font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--grey);pointer-events:none;margin:0}
.hint.off{opacity:0!important}
footer{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:13px}
footer a{color:var(--grey);margin:0 12px;text-decoration:none;text-shadow:0 1px 8px #000}
footer a:hover{color:var(--cream)}

@media (max-height:560px){.lead{display:none}.eye{width:20vmin}}
@media (prefers-reduced-motion:reduce){
  .eye .draw{stroke-dashoffset:0}.on .eye .draw{animation:none}
  .iris{transform:scale(1);transition:none}
  h1 span{opacity:1;filter:none;transform:none}.on h1 span{animation:none}
  .rule{width:min(60vw,320px);transition:none}
  .fade{opacity:1;transform:none;filter:none;transition:none}
  .caret{display:none}.hint{display:none}
}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

<main class="stage" id="stage">
  <div class="card">
    <svg class="eye" viewBox="0 0 200 200" role="img" aria-label="Geheimkabinett: ein Auge mit einem Schlüsselloch als Pupille">
      <g class="lidgroup" id="lid">
        <circle class="draw" style="--len:580" cx="100" cy="100" r="92" fill="none" stroke="#C9A45C" stroke-width="5" pathLength="580"/>
        <path class="draw lid" style="--len:400" d="M26 100 Q100 34 174 100 Q100 166 26 100 Z" fill="none" stroke="#C9A45C" stroke-width="6" stroke-linejoin="round" pathLength="400"/>
        <clipPath id="almond"><path d="M26 100 Q100 34 174 100 Q100 166 26 100 Z"/></clipPath>
        <g clip-path="url(#almond)"><g class="look" id="look"><g class="iris">
          <circle cx="100" cy="100" r="33" fill="#C9A45C"/>
          <circle cx="100" cy="90" r="11.25" fill="#0E0D0B"/>
          <path d="M94.375 97.5 L89.375 125 L110.625 125 L105.625 97.5 Z" fill="#0E0D0B"/>
          <circle cx="114" cy="86" r="3.5" fill="#ECE6D9"/>
        </g></g></g>
      </g>
    </svg>
    <h1 id="title" aria-label="Geheimkabinett"></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="tag"><span id="tag"></span><span class="caret" aria-hidden="true"></span></p>
    <p class="lead fade f1">Bilderrätsel, Worträtsel und kurze Fälle zum Mitraten. Die Lösung steckt immer im Detail. Schau genau hin.</p>
    <ul class="links fade f2">
      <li><a href="[INSTAGRAM-LINK]" rel="noopener">Instagram</a></li>
      <li><a href="[TIKTOK-LINK]" rel="noopener">TikTok</a></li>
      <li><a href="[YOUTUBE-LINK]" rel="noopener">YouTube</a></li>
      <li><a href="[FACEBOOK-LINK]" rel="noopener">Facebook</a></li>
    </ul>
    <p class="fade f3"><a class="mail" href="mailto:hallo@geheimkabinett.de">hallo@geheimkabinett.de</a></p>
  </div>
</main>
<p class="hint fade f4" id="hint" aria-hidden="true">Leuchte den Raum aus</p>
<footer><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a></footer>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes, uImg, uPtr;
uniform float uTime, uReveal, uLight, uFade;

float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*noise(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}

void main(){
  vec2 frag=gl_FragCoord.xy;
  float sc=max(uRes.x/uImg.x,uRes.y/uImg.y)*1.09;
  vec2 uv=(frag-.5*uRes)/(uImg*sc)+vec2(.52,.5);
  vec2 p=(frag-.5*uRes)/uRes.y;

  // Tiefe: der Raum läuft auf die Tür zu, also ist die Mitte fern und der Rand nah
  vec2 vp=vec2(.53,.56);
  float depth=smoothstep(.02,.6,length((uv-vp)*vec2(1.,1.25)));
  float zoom=1.-.014*sin(uTime*.22)-.05*(1.-uReveal);
  vec2 suv=vp+(uv-vp)*zoom-uPtr*depth*vec2(.024,.015);
  vec2 ca=(suv-vp)*.005*depth;
  vec3 col=vec3(texture2D(uTex,suv+ca).r,texture2D(uTex,suv).g,texture2D(uTex,suv-ca).b);

  // Laterne am Zeiger
  vec2 lp=uPtr*vec2(.5*uRes.x/uRes.y,.5);
  float L=exp(-dot(p-lp,p-lp)/.085);
  float flick=.9+.1*noise(vec2(uTime*3.2,1.3));
  col*=mix(1.,.38+1.35*L*flick,uLight);

  // Licht aus dem Türspalt, Dunst und Staub
  vec3 gold=vec3(1.,.74,.34);
  vec2 door=vec2(.565,.56);
  float dm=exp(-length((suv-door)*vec2(1.6,1.))*3.2);
  float haze=fbm(suv*vec2(3.,5.)+vec2(uTime*.03,-uTime*.05));
  col+=gold*dm*(.08+.3*haze)*(.85+.15*sin(uTime*1.7));
  float dust=0.;
  for(int i=0;i<3;i++){
    float fi=float(i);
    vec2 q=p*(6.+fi*5.)+vec2(uTime*.02*(fi+1.),-uTime*(.03+.02*fi))+fi*17.;
    vec2 id=floor(q),f=fract(q)-.5;
    float h=hash(id+fi*3.1);
    vec2 o=vec2(hash(id+1.7),hash(id+8.3))-.5;
    float tw=.5+.5*sin(uTime*(1.+h*2.)+h*40.);
    dust+=step(.7,h)*smoothstep(.05,0.,length(f-o*.7))*tw;
  }
  col+=gold*dust*(.5*dm+.55*L*uLight+.04);

  // Vignette
  vec2 q2=frag/uRes-.5;
  col*=mix(.3,1.,smoothstep(.85,.25,length(q2)));

  // Schlüsselloch-Blende, die sich öffnet
  float e=uReveal*uReveal*uReveal;
  float s=mix(.9,16.,e);
  vec2 k=p/s;
  float dc=length(k-vec2(0.,.10))-.17;
  float ty=clamp((.05-k.y)/.40,0.,1.);
  float dt=max(abs(k.x)-mix(.075,.16,ty),max(k.y-.05,-.35-k.y));
  float dk=min(dc,dt)*s;
  float m=smoothstep(.004,-.004,dk);
  float rim=exp(-abs(dk)*45.)*(1.-uReveal);
  col=col*m+gold*rim*.7;

  col+=(hash(frag+fract(uTime)*100.)-.5)*.045;
  gl_FragColor=vec4(col*uFade,1.);
}
</script>
<script>
(function(){
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage=document.getElementById('stage'), hint=document.getElementById('hint');

  var title=document.getElementById('title');
  'GEHEIMKABINETT'.split('').forEach(function(ch,i){var s=document.createElement('span');s.textContent=ch;s.style.setProperty('--i',i);s.setAttribute('aria-hidden','true');title.appendChild(s);});

  var tagText='Jeder Fall ein Rätsel', tagEl=document.getElementById('tag');
  function typeTag(delay){
    if(reduce){tagEl.textContent=tagText;return;}
    setTimeout(function(){var i=0;(function step(){tagEl.textContent=tagText.slice(0,++i);if(i<tagText.length)setTimeout(step,50+Math.random()*60);})();},delay);
  }
  function showCard(){document.documentElement.classList.add('on');document.body.classList.add('on');typeTag(2500);blinkLater(4000);}

  // Auge: blinzeln und dem Zeiger folgen
  var lid=document.getElementById('lid'), look=document.getElementById('look'), eye=document.querySelector('.eye');
  function blinkLater(d){if(reduce)return;setTimeout(function(){lid.classList.remove('blink');requestAnimationFrame(function(){requestAnimationFrame(function(){lid.classList.add('blink');});});blinkLater(4000+Math.random()*5000);},d);}
  function aimEye(x,y){var r=eye.getBoundingClientRect(),dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(1,d/400);
    look.setAttribute('transform','translate('+(dx/d*k*22).toFixed(1)+' '+(dy/d*k*10).toFixed(1)+')');}

  // Zeiger (Maus oder Finger); ohne Bewegung wandert die Laterne von selbst
  var tx=0,ty=0,px=0,py=0,lastMove=-1e9,cx=innerWidth/2,cy=innerHeight/2;
  function onMove(e){cx=e.clientX;cy=e.clientY;lastMove=performance.now();hint.classList.add('off');}
  window.addEventListener('pointermove',onMove,{passive:true});
  window.addEventListener('pointerdown',onMove,{passive:true});

  // Magnetische Buttons
  if(!reduce&&window.matchMedia('(hover:hover)').matches){
    document.querySelectorAll('.links a').forEach(function(a){
      a.addEventListener('pointermove',function(e){var r=a.getBoundingClientRect();a.style.transform='translate('+((e.clientX-r.left-r.width/2)*.25).toFixed(1)+'px,'+((e.clientY-r.top-r.height/2)*.35).toFixed(1)+'px)';});
      a.addEventListener('pointerleave',function(){a.style.transform='';});
    });
  }

  // WebGL
  var canvas=document.getElementById('gl');
  var gl=canvas.getContext('webgl',{antialias:false,alpha:false,powerPreference:'high-performance'});
  function fallback(){document.documentElement.classList.add('nogl');showCard();}
  if(!gl){fallback();return;}
  function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));return null;}return s;}
  var vs=sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}');
  var fs=sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent);
  if(!vs||!fs){fallback();return;}
  var prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){fallback();return;}
  gl.useProgram(prog);
  var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(prog,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  var U={};['uTex','uRes','uImg','uPtr','uTime','uReveal','uLight','uFade'].forEach(function(n){U[n]=gl.getUniformLocation(prog,n);});

  function resize(){var dpr=Math.min(window.devicePixelRatio||1,1.5);var w=Math.round(innerWidth*dpr),h=Math.round(innerHeight*dpr);
    if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}gl.uniform2f(U.uRes,w,h);}
  window.addEventListener('resize',resize);

  var img=new Image();
  img.onerror=fallback;
  img.onload=function(){
    var tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,img);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.uniform1i(U.uTex,0);gl.uniform2f(U.uImg,img.naturalWidth,img.naturalHeight);
    resize();
    var t0=performance.now(), shown=false;
    function ease(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}
    function frame(now){
      var t=(now-t0)/1000;
      var forced=window.__t; if(forced!=null){t=forced;}
      var reveal=reduce?1:ease((t-1.1)/2.6);
      if(!shown&&(reduce||t>2.4)){shown=true;showCard();}
      // Zielposition: echter Zeiger oder langsames Wandern
      if(now-lastMove>3500||forced!=null){var a=t*.35;tx=Math.sin(a)*.55;ty=Math.sin(a*1.7+1.)*.35;if(forced==null)aimEye(innerWidth/2+tx*innerWidth/2,innerHeight/2-ty*innerHeight/2);}
      else{tx=cx/innerWidth*2-1;ty=-(cy/innerHeight*2-1);aimEye(cx,cy);}
      px+=(tx-px)*.07;py+=(ty-py)*.07;
      gl.uniform2f(U.uPtr,reduce?0:px,reduce?0:py);
      gl.uniform1f(U.uTime,reduce?0:t);
      gl.uniform1f(U.uReveal,reveal);
      gl.uniform1f(U.uLight,reduce?0:ease((t-3.4)/1.8));
      gl.uniform1f(U.uFade,reduce?1:ease(t/.9));
      gl.drawArrays(gl.TRIANGLES,0,3);
      if(!reduce)requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    if(reduce)window.addEventListener('resize',function(){requestAnimationFrame(frame);});
  };
  img.src='hero.webp';
})();
</script>
</body>
</html>
