<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geheimkabinett – Jeder Fall ein Rätsel</title>
<meta name="description" content="Rätsel, Fälle und versteckte Hinweise. Schau genau hin – findest du die Lösung?">
<meta name="theme-color" content="#0E0D0B">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Cormorant Garamond";font-weight:600;font-display:swap;src:url(fonts/cormorant-600.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url(fonts/inter-400.woff2) format("woff2")}
:root{--bg:#0E0D0B;--gold:#C9A45C;--gold-hi:#E8CC8E;--cream:#ECE6D9;--grey:#A89F8E}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);font-family:Inter,system-ui,sans-serif;overflow:hidden}
a{color:var(--gold)}

/* ---------- Bühne ---------- */
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
.beam{position:absolute;inset:-20%;background:radial-gradient(ellipse 55% 45% at 50% 46%,rgba(201,164,92,.16),rgba(201,164,92,.04) 45%,transparent 70%);animation:breathe 7s ease-in-out infinite;pointer-events:none}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}

/* ---------- Filmeffekte ---------- */
#grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.13;mix-blend-mode:screen;image-rendering:pixelated;z-index:5}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.55) 80%,rgba(0,0,0,.92) 100%)}
.flicker{position:fixed;inset:0;pointer-events:none;z-index:7;background:#000;animation:flicker 4.2s steps(1) infinite;opacity:0}
@keyframes flicker{0%{opacity:0}3%{opacity:.07}5%{opacity:0}31%{opacity:.04}32%{opacity:0}58%{opacity:.09}59%{opacity:.02}61%{opacity:0}87%{opacity:.05}88%{opacity:0}}
.gate{position:fixed;inset:0;pointer-events:none;z-index:8;box-shadow:inset 0 0 0 10px #000,inset 0 0 60px 20px rgba(0,0,0,.7)}
#scratches{position:fixed;inset:0;pointer-events:none;z-index:6}
#scratches i{position:absolute;top:0;bottom:0;width:1px;background:linear-gradient(transparent,rgba(236,230,217,.35) 20%,rgba(236,230,217,.15) 70%,transparent)}
.weave{animation:weave .16s steps(2) infinite}
@keyframes weave{0%{transform:translate(0,0)}50%{transform:translate(.4px,-.6px)}100%{transform:translate(-.3px,.4px)}}

/* ---------- Vorspann-Countdown ---------- */
.leader{position:absolute;inset:0;display:grid;place-items:center;z-index:4;background:#1a1712;transition:opacity .5s}
.leader.gone{opacity:0;pointer-events:none}
.leader svg{width:min(70vmin,520px);height:auto}
.leader .num{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:150px;fill:var(--cream)}
.leader .sweep{transform-origin:200px 200px;animation:sweep 1s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.skip{position:absolute;bottom:28px;right:32px;z-index:9;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--grey);background:none;border:0;cursor:pointer;padding:14px;min-height:44px}
.skip:hover{color:var(--cream)}

/* ---------- Karte ---------- */
.card{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(14px,2.6vh,26px);padding:24px}
.eye{width:min(34vmin,250px);height:auto;overflow:visible;filter:drop-shadow(0 0 18px rgba(201,164,92,.25))}
.eye .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.on .eye .draw{animation:draw 1.6s cubic-bezier(.6,.05,.3,1) forwards}
.on .eye .ring{animation-delay:.1s}.on .eye .lid{animation-delay:.7s}
@keyframes draw{to{stroke-dashoffset:0}}
.iris{transform-box:view-box;transform-origin:100px 100px;transform:scale(0);transition:transform .9s cubic-bezier(.2,1.4,.4,1) 1.7s}
.on .iris{transform:scale(1)}
.lidgroup{transform-box:view-box;transform-origin:100px 100px}
.lidgroup.blink{animation:blink .32s ease-in-out}
@keyframes blink{0%,100%{transform:scaleY(1)}45%{transform:scaleY(.06)}}
.look{transition:transform .35s cubic-bezier(.2,.8,.3,1)}

h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(28px,7.2vw,86px);letter-spacing:.2em;margin:0 -.2em 0 0;line-height:1;white-space:nowrap}
h1 span{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(12px)}
.on h1 span{animation:letter .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(2.3s + var(--i)*.07s)}
@keyframes letter{60%{opacity:1;filter:blur(0);color:var(--gold-hi);text-shadow:0 0 22px rgba(232,204,142,.8)}100%{opacity:1;filter:blur(0);transform:none;color:var(--cream);text-shadow:0 0 0 transparent}}
.rule{width:0;height:1px;background:var(--gold);transition:width 1.2s cubic-bezier(.6,0,.2,1) 3.4s}
.on .rule{width:140px}
.tag{font-size:clamp(11px,1.6vw,15px);letter-spacing:.45em;text-transform:uppercase;color:var(--grey);margin:0 -.45em 0 0;min-height:1.4em}
.tag .caret{display:inline-block;width:.55em;border-bottom:1px solid var(--gold);margin-left:2px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.fade{opacity:0;transform:translateY(14px);transition:opacity 1s ease,transform 1s ease}
.on .fade{opacity:1;transform:none}
.on .f1{transition-delay:5.4s}.on .f2{transition-delay:5.8s}.on .f3{transition-delay:6.1s}
.lead{max-width:30em;margin:6px 0 0;color:var(--cream);opacity:.85;line-height:1.6;font-size:clamp(14px,1.8vw,17px)}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;list-style:none;padding:0;margin:4px 0 0}
.links a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:10px 22px;border:1px solid rgba(201,164,92,.7);border-radius:999px;text-decoration:none;letter-spacing:.12em;font-size:14px;color:var(--cream);overflow:hidden;transition:color .3s,border-color .3s}
.links a::before{content:"";position:absolute;inset:0;background:var(--gold);transform:translateY(101%);transition:transform .35s cubic-bezier(.6,0,.2,1);z-index:-1}
.links a:hover,.links a:focus-visible{color:var(--bg);border-color:var(--gold)}
.links a:hover::before,.links a:focus-visible::before{transform:none}
.mail{font-size:15px;letter-spacing:.06em}
footer{position:fixed;bottom:18px;left:0;right:0;z-index:9;text-align:center;font-size:13px}
footer a{color:var(--grey);margin:0 12px;text-decoration:none}
footer a:hover{color:var(--cream)}

@media (prefers-reduced-motion:reduce){
  .beam,.flicker,.weave,.leader .sweep{animation:none}
  .leader{display:none}
  .eye .draw{stroke-dashoffset:0}
  .iris{transform:scale(1);transition:none}
  h1 span{opacity:1;filter:none;transform:none}
  .on h1 span{animation:none}
  .rule{width:140px;transition:none}
  .fade{opacity:1;transform:none;transition:none}
}
</style>
</head>
<body>
<canvas id="grain" aria-hidden="true"></canvas>
<div id="scratches" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="flicker" aria-hidden="true"></div>
<div class="gate" aria-hidden="true"></div>

<main class="stage weave" id="stage">
  <div class="beam" aria-hidden="true"></div>

  <div class="leader" id="leader" aria-hidden="true">
    <svg viewBox="0 0 400 400">
      <circle cx="200" cy="200" r="170" fill="none" stroke="#ECE6D9" stroke-opacity=".5" stroke-width="3"/>
      <circle cx="200" cy="200" r="140" fill="none" stroke="#ECE6D9" stroke-opacity=".35" stroke-width="2"/>
      <line x1="0" y1="200" x2="400" y2="200" stroke="#ECE6D9" stroke-opacity=".3"/>
      <line x1="200" y1="0" x2="200" y2="400" stroke="#ECE6D9" stroke-opacity=".3"/>
      <path class="sweep" d="M200 200 L200 30 A170 170 0 0 1 347 115 Z" fill="#C9A45C" fill-opacity=".22"/>
      <text class="num" id="num" x="200" y="252" text-anchor="middle">3</text>
    </svg>
  </div>

  <div class="card" id="card">
    <svg class="eye" viewBox="0 0 200 200" role="img" aria-label="Geheimkabinett: ein Auge mit einem Schlüsselloch als Pupille">
      <g class="lidgroup" id="lid">
        <circle class="draw ring" style="--len:580" cx="100" cy="100" r="92" fill="none" stroke="#C9A45C" stroke-width="5" pathLength="580"/>
        <path class="draw lid" style="--len:400" d="M26 100 Q100 34 174 100 Q100 166 26 100 Z" fill="none" stroke="#C9A45C" stroke-width="6" stroke-linejoin="round" pathLength="400"/>
        <clipPath id="almond"><path d="M26 100 Q100 34 174 100 Q100 166 26 100 Z"/></clipPath>
        <g clip-path="url(#almond)">
          <g class="look" id="look">
            <g class="iris">
              <circle cx="100" cy="100" r="33" fill="#C9A45C"/>
              <circle cx="100" cy="90" r="11.25" fill="#0E0D0B"/>
              <path d="M94.375 97.5 L89.375 125 L110.625 125 L105.625 97.5 Z" fill="#0E0D0B"/>
              <circle cx="114" cy="86" r="3.5" fill="#ECE6D9"/>
            </g>
          </g>
        </g>
      </g>
    </svg>

    <h1 id="title" aria-label="Geheimkabinett"></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="tag"><span id="tag"></span><span class="caret" id="caret" aria-hidden="true"></span></p>

    <p class="lead fade f1">Bilderrätsel, Worträtsel und kurze Fälle zum Mitraten. Die Lösung steckt immer im Detail. Schau genau hin.</p>
    <ul class="links fade f2">
      <li><a href="[INSTAGRAM-LINK]" rel="noopener">Instagram</a></li>
      <li><a href="[TIKTOK-LINK]" rel="noopener">TikTok</a></li>
      <li><a href="[YOUTUBE-LINK]" rel="noopener">YouTube</a></li>
      <li><a href="[FACEBOOK-LINK]" rel="noopener">Facebook</a></li>
    </ul>
    <p class="fade f3"><a class="mail" href="mailto:hallo@geheimkabinett.de">hallo@geheimkabinett.de</a></p>
  </div>

  <button class="skip" id="skip" type="button">Vorspann überspringen</button>
</main>

<footer><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a></footer>

<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage');
  var leader = document.getElementById('leader');
  var num = document.getElementById('num');
  var skip = document.getElementById('skip');

  // Titel in Buchstaben zerlegen
  var title = document.getElementById('title');
  'GEHEIMKABINETT'.split('').forEach(function(ch,i){
    var s=document.createElement('span'); s.textContent=ch; s.style.setProperty('--i',i); s.setAttribute('aria-hidden','true'); title.appendChild(s);
  });

  // Schreibmaschine für die Unterzeile
  var tagText='Jeder Fall ein Rätsel', tagEl=document.getElementById('tag');
  function typeTag(delay){
    if(reduce){tagEl.textContent=tagText;return;}
    setTimeout(function(){
      var i=0; (function step(){ tagEl.textContent=tagText.slice(0,++i); if(i<tagText.length) setTimeout(step,55+Math.random()*60); })();
    },delay);
  }

  var started=false;
  function start(fast){
    if(started) return; started=true;
    leader.classList.add('gone'); skip.style.display='none';
    stage.classList.add('on');
    if(fast){ stage.classList.add('fast'); }
    typeTag(fast?0:3700);
    scheduleBlink(fast?2500:5200);
  }

  // Countdown 3-2-1
  if(reduce){ start(true); }
  else {
    var n=3;
    var t=setInterval(function(){ n--; if(n>0){ num.textContent=n; } else { clearInterval(t); start(false); } },900);
    skip.addEventListener('click',function(){ clearInterval(t); start(false); });
  }

  // Blinzeln
  var lid=document.getElementById('lid');
  function scheduleBlink(d){
    if(reduce) return;
    setTimeout(function(){ lid.classList.remove('blink'); void lid.getBBox; requestAnimationFrame(function(){ lid.classList.add('blink'); }); scheduleBlink(4500+Math.random()*5000); },d);
  }

  // Das Auge folgt dem Blick
  var look=document.getElementById('look'), eye=document.querySelector('.eye');
  function aim(x,y){
    var r=eye.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    var dx=x-cx, dy=y-cy, d=Math.hypot(dx,dy)||1, k=Math.min(1,d/400);
    look.setAttribute('transform','translate('+(dx/d*k*22).toFixed(1)+' '+(dy/d*k*10).toFixed(1)+')');
  }
  if(!reduce){
    window.addEventListener('pointermove',function(e){ aim(e.clientX,e.clientY); idle=false; });
    var idle=true;
    setInterval(function(){ if(!idle) return; aim(Math.random()*innerWidth, Math.random()*innerHeight); },2600);
    window.addEventListener('pointerleave',function(){ idle=true; });
  }

  // Filmkorn
  var c=document.getElementById('grain'), g=c.getContext('2d'), w=160, h=90;
  c.width=w; c.height=h;
  var img=g.createImageData(w,h);
  function grain(){
    var d=img.data;
    for(var i=0;i<d.length;i+=4){ var v=Math.random()*255|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
    g.putImageData(img,0,0);
  }
  grain();
  if(!reduce){ setInterval(grain,1000/18); }

  // Kratzer auf dem Film
  var sc=document.getElementById('scratches');
  if(!reduce){
    setInterval(function(){
      sc.innerHTML='';
      if(Math.random()<.55){
        var n=1+(Math.random()*2|0);
        for(var i=0;i<n;i++){ var s=document.createElement('i'); s.style.left=(Math.random()*100)+'%'; s.style.opacity=(.3+Math.random()*.7); sc.appendChild(s); }
      }
    },140);
  }
})();
</script>
</body>
</html>
